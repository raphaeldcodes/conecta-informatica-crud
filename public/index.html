<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conecta Informática - Cadastro de Produtos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <h1>Conecta Informática</h1>
        <p>Cadastro e manutenção de produtos</p>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <h2 id="formTitle">Cadastrar Produto</h2>

        <form id="productForm">
          <input type="hidden" id="productId" />

          <div class="form-grid">
            <div class="field">
              <label for="nome">Nome</label>
              <input id="nome" name="nome" type="text" required placeholder="Ex.: Mouse USB" />
            </div>

            <div class="field">
              <label for="categoria">Categoria</label>
              <select id="categoria" name="categoria" required>
                <option value="">Selecione</option>
                <option value="Periféricos">Periféricos</option>
                <option value="Monitores">Monitores</option>
                <option value="Cabos">Cabos</option>
                <option value="Armazenamento">Armazenamento</option>
              </select>
            </div>

            <div class="field">
              <label for="preco">Preço (R$)</label>
              <input id="preco" name="preco" type="number" min="0.01" step="0.01" required placeholder="45.90" />
            </div>

            <div class="field">
              <label for="quantidade">Quantidade em estoque</label>
              <input id="quantidade" name="quantidade" type="number" min="0" step="1" required placeholder="10" />
            </div>
          </div>

          <div class="field full-width">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="4" placeholder="Informe uma descrição do produto"></textarea>
          </div>

          <div class="actions">
            <button type="submit" class="primary">Salvar</button>
            <button type="button" class="secondary" id="cancelEditBtn">Cancelar Edição</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Consultar produto por ID</h2>
        <form id="searchForm" class="inline-form">
          <input id="searchId" type="number" min="1" placeholder="Digite o ID" required />
          <button type="submit" class="primary">Consultar</button>
        </form>
      </section>

      <div id="messageBox" class="message" aria-live="polite"></div>

      <section class="panel">
        <h2>Produtos cadastrados</h2>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="productTableBody">
              <tr>
                <td colspan="7" class="empty-state">Carregando produtos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
